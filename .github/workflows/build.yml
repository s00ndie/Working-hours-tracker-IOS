name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Generate iOS project
      run: briefcase create ios --no-input

    - name: Build iOS app
      run: briefcase build ios --no-input

    - name: Package iOS app (.ipa)
      run: briefcase package ios --no-input

    - name: Find and show IPA path
      run: find . -name "*.ipa"

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-IPA
        path: '**/build/Release-iphoneos/*.ipa'