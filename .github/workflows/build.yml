
name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Create iOS project
      run: briefcase create iOS --no-input

    - name: Build iOS project
      run: briefcase build iOS --no-input

    - name: Package IPA
      run: |
        APP_PATH=$(find build/WorkTracker/ios -type d -name "*.app" | head -n 1)

        if [ -z "$APP_PATH" ]; then
          echo "No .app found"
          find build/WorkTracker/ios -type d -name "*.app"
          exit 1
        fi

        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r WorkTracker.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-IPA
        path: WorkTracker.ipa
