
name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Create iOS project
      run: briefcase create iOS --no-input

    - name: Disable framework signing in CI
      run: |
        python3 - <<'PY'
        from pathlib import Path

        path = Path(
            "build/WorkTracker/ios/xcode/Support/Python.xcframework/build/utils.sh"
        )

        content = path.read_text()

        old = '''    /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" ${OTHER_CODE_SIGN_FLAGS:-} -o runtime --timestamp=none --preserve-metadata=identifier,entitlements,flags --generate-entitlement-der "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER"'''

        new = '''    if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
        /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" ${OTHER_CODE_SIGN_FLAGS:-} -o runtime --timestamp=none --preserve-metadata=identifier,entitlements,flags --generate-entitlement-der "$CODESIGNING_FOLDER_PATH/$FRAMEWORK_FOLDER"
        else
        echo "Skipping framework signing; AltServer will sign the app later."
        fi'''

        if old not in content:
            raise SystemExit("Could not find the signing command!")

        path.write_text(content.replace(old, new))
        print("Framework signing patch applied.")
        PY

    - name: Build for physical iPhone
      run: |
        xcodebuild \
          -project "build/WorkTracker/ios/xcode/Work Tracker.xcodeproj" \
          -scheme "Work Tracker" \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath "$GITHUB_WORKSPACE/ios-build" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Package IPA
      run: |
        find build/WorkTracker/ios/xcode \
          -type d \
          -name "Release-iphoneos" \
          -print

        APP_PATH=$(find build/WorkTracker/ios/xcode \
          -type d \
          -path "*/Release-iphoneos/*.app" \
          -print -quit)

        if [ -z "$APP_PATH" ]; then
          echo "No iPhone app found!"
          exit 1
        fi

        echo "Found app: $APP_PATH"

        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r WorkTracker.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-IPA
        path: WorkTracker.ipa
