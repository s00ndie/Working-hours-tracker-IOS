
name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Create iOS project
      run: briefcase create ios --no-input

    
    - name: Diagnose framework signing
      run: |
        echo "Searching for framework signing commands..."

        grep -R -n -C 5 "Signing framework as" build/WorkTracker/ios/xcode || true

        echo "Searching for codesign commands..."

        grep -R -n -C 3 "codesign" build/WorkTracker/ios/xcode \
          --include="*.sh" \
          --include="project.pbxproj" || true


    
    - name: Find iOS App
      run: |
        echo "Searching for .app bundles..."

        find . -type d -name "*.app" -print

        echo "Searching build directories..."

        find build/WorkTracker/ios -maxdepth 6 -type d -print || true

        echo "Checking Xcode build products..."

        find build/WorkTracker/ios -type d -name "Release-iphoneos" -print || true


    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-IPA
        path: WorkTracker.ipa
