name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Create iOS project
      run: briefcase create ios --no-input

    - name: Build iOS app
      run: briefcase build ios --no-input

    - name: Archive build folder
      run: tar -czf ios-project-build.tar.gz iOS/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Source-Build
        path: ios-project-build.tar.gz