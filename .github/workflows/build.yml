name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Create iOS project
      run: briefcase create ios Xcode --no-input

    - name: Build iOS app without signing enforcement
      run: |
        XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
        BUILD_DIR=$(dirname "$XCODEPROJ")
        echo "Found xcodeproj at: $XCODEPROJ"
        
        # Збираємо проєкт, примусово вимкнувши підпис код-сайнінгу для скриптів
        xcodebuild -project "$XCODEPROJ" \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   EXPANDED_CODE_SIGN_IDENTITY="" \
                   codesign_identity="" \
                   clean build

    - name: Pack .app to .ipa
      run: |
        APP_PATH=$(find . -path "*/Release-iphoneos/*.app" | head -n 1)
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)
        fi
        
        echo "Packing App from: $APP_PATH"
        
        chmod -R +x "$APP_PATH"
        mkdir Payload
        cp -r "$APP_PATH" Payload/
        zip -r WorkTracker.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-IPA
        path: WorkTracker.ipa