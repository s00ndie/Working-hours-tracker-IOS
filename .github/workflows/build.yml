name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Create iOS project
      run: briefcase create ios --no-input

    - name: Build iOS app with Briefcase
      run: briefcase build ios --no-input

    - name: Build IPA via Xcode command line
      run: |
        cd macos/ios/xcodeproj
        xcodebuild -project WorkTracker.xcodeproj -scheme WorkTracker -configuration Release -sdk iphoneos -allowProvisioningUpdates CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Find and show IPA path
      run: find . -name "*.ipa" -o -name "*.app"

    - name: Upload App artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-App
        path: |
          macos/ios/xcodeproj/build/Release-iphoneos/**/*.ipa
          macos/ios/xcodeproj/build/Release-iphoneos/**/*.app