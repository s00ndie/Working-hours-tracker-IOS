
name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Create iOS project
      run: briefcase create ios --no-input

    - name: Build iOS app
      run: |
        XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)

        xcodebuild -project "$XCODEPROJ" \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=YES \
          CODE_SIGN_STYLE=Manual \
          clean build

    - name: Pack .app to .ipa
      run: |
        APP_PATH=$(find . -path "*/Release-iphoneos/*.app" | head -n 1)

        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)
        fi

        if [ -z "$APP_PATH" ]; then
          echo "ERROR: App not found!"
          exit 1
        fi

        echo "Packing App from: $APP_PATH"

        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r WorkTracker.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-IPA
        path: WorkTracker.ipa
