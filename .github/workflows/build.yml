name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Briefcase
      run: pip install briefcase

    - name: Create iOS project
      run: briefcase create ios --no-input

    - name: Build iOS app
      run: briefcase build ios --no-input

    - name: Pack .app to .ipa automatically
      run: |
        # Знаходимо згенеровану пачу .app усередині build
        APP_PATH=$(find . -type d -name "*.app" | head -n 1)
        echo "Found App at: $APP_PATH"
        
        # Створюємо потрібну для iOS структуру Payload/ і пакуємо в .ipa
        mkdir Payload
        cp -r "$APP_PATH" Payload/
        zip -r WorkTracker.ipa Payload
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: WorkTracker-IPA
        path: WorkTracker.ipa